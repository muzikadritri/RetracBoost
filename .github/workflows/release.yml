# Baut Retrac Boost auf Windows und veröffentlicht RetracBoost.exe + RetracBoost-Setup.exe als GitHub-Release.
# Auslöser: ein Tag "v*" (z. B. v1.0.2) oder manuell über "Run workflow".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. v1.0.2)'
        required: true
      replace:
        description: 'Vorhandenen Release mit diesem Tag vorher löschen (inkl. Tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version prüfen
        shell: pwsh
        run: |
          $want = $env:TAG.TrimStart('v')
          $src = Get-Content RetracBoost/AutoUpdater.cs -Raw
          if ($src -notmatch "CurrentVersion = `"$([regex]::Escape($want))`"") {
            throw "AutoUpdater.CurrentVersion passt nicht zu Tag $env:TAG"
          }

      - name: Alte Build-Reste entfernen
        shell: pwsh
        run: |
          foreach ($d in 'RetracBoost/obj','RetracBoost/bin','RetracBoostSetup/obj','RetracBoostSetup/bin') {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
          }

      - name: Bauen (App + Setup)
        shell: pwsh
        run: ./RetracBoost/build.ps1 -Config Release

      - name: Ergebnis prüfen
        shell: pwsh
        run: |
          foreach ($f in 'RetracBoost.exe','RetracBoost-Setup.exe') {
            if (-not (Test-Path $f)) { throw "$f fehlt" }
            $v = (Get-Item $f).VersionInfo.ProductVersion
            "{0}: {1:N0} Bytes, Version {2}" -f $f, (Get-Item $f).Length, $v
          }

      - name: Alten Release löschen
        if: ${{ github.event.inputs.replace == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Release $env:TAG konnte nicht gelöscht werden" }
            "Release $env:TAG gelöscht"
          } else {
            git push origin ":refs/tags/$env:TAG" 2>$null
            "Kein Release $env:TAG vorhanden"
          }
          $global:LASTEXITCODE = 0

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Retrac Boost ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            RetracBoost.exe
            RetracBoost-Setup.exe
          body_path: release-notes.md
